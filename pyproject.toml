[project]
name = "prometheus"
version = "0.2.0"
description = "Prometheus: an agent that works alongside analysts."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "langchain-openai==1.6.6",
    "langgraph==1.2.11",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "uvicorn>=0.35,<1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
